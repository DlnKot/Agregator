name: Build and Release
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build Windows
      run: npm run build:win
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: false

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-artifacts
        path: |
          dist/Alfa.Remote.Client-*-Setup.exe
          dist/Alfa.Remote.Client-*-Setup.exe.blockmap
          dist/latest.yml
        retention-days: 7

  build-macos:
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build macOS
      run: npm run build:mac
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: false

    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: macos-artifacts
        path: |
          dist/Alfa*.dmg
          dist/Alfa*.dmg.blockmap
          dist/latest-mac.yml
        retention-days: 7

  create-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Prepare release files
      run: |
        mkdir -p release-files
        find artifacts -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.yml" -o -name "*.blockmap" \) -exec cp {} release-files/ \;

    - name: Get version
      id: version
      run: |
        VERSION=$(node -e "console.log(require('./package.json').version)")
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        files: release-files/*
        tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
        name: Release ${{ steps.version.outputs.version }}
        draft: false
        prerelease: false
        body: |
          **Stable Release**
          Version: ${{ steps.version.outputs.version }}
          Installers:
          - Windows: Alfa.Remote.Client-*.exe
          - macOS: Alfa*.dmg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}