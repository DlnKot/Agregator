name: Build and Release
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc
    - name: Install dependencies
      run: npm ci
    - name: Build Windows
      run: npm run build:win
    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-artifacts
        path: |
          src-tauri/target/**/bundle/msi/*.msi
          src-tauri/target/**/bundle/nsis/*.exe
        retention-days: 7

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-apple-darwin
    - name: Install dependencies
      run: npm ci
    - name: Build macOS
      run: npm run build:mac
    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: macos-artifacts
        path: |
          src-tauri/target/**/bundle/dmg/*.dmg
        retention-days: 7

  create-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: Prepare release files
      run: |
        mkdir -p release-files
        find artifacts -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.dmg" \) -exec cp {} release-files/ \;
    - name: Get version
      id: version
      run: |
        VERSION=$(node -e "console.log(require('./package.json').version)")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        files: release-files/*
        tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
        name: Release ${{ steps.version.outputs.version }}
        draft: false
        prerelease: false
        body: |
          **Stable Release**
          Version: ${{ steps.version.outputs.version }}
          Installers:
          - Windows: MSI + NSIS installer
          - macOS: DMG
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
